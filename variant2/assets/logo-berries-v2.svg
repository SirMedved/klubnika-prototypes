<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100" role="img" aria-label="Клубника и голубика" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- форма клубники -->
    <path id="sb" d="M0 -34 C-22 -38 -36 -26 -35 -6 C-34 16 -16 36 0 44 C16 36 34 16 35 -6 C36 -26 22 -38 0 -34Z"/>
    <clipPath id="sbClip"><use href="#sb"/></clipPath>

    <linearGradient id="sbFront" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff6657"/>
      <stop offset="0.55" stop-color="#e5303a"/>
      <stop offset="1" stop-color="#b5162a"/>
    </linearGradient>
    <radialGradient id="sbShade" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a0010" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="seeds" width="11" height="13" patternUnits="userSpaceOnUse">
      <g id="seed">
        <ellipse cx="5.5" cy="4" rx="2.7" ry="3.5" fill="#8a0f1e" opacity="0.45"/>
        <ellipse cx="5.5" cy="3.6" rx="1.5" ry="2.3" fill="#f7cc4a"/>
      </g>
      <use href="#seed" x="-5.5" y="6.5"/>
      <use href="#seed" x="5.5" y="6.5"/>
    </pattern>

    <linearGradient id="leafG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2a7d33"/>
      <stop offset="1" stop-color="#6cc552"/>
    </linearGradient>

    <!-- чашелистики клубники -->
    <path id="cl" d="M0 0 C5 -5 15 -5 21 0 C15 5 5 5 0 0Z" fill="url(#leafG)" stroke="#1f6a2c" stroke-width="0.6" stroke-opacity="0.6"/>
    <g id="calyx">
      <g opacity="0.9">
        <use href="#cl" transform="rotate(-25)"/>
        <use href="#cl" transform="rotate(-155)"/>
        <use href="#cl" transform="rotate(-90) scale(0.75)"/>
      </g>
      <use href="#cl" transform="rotate(20)"/>
      <use href="#cl" transform="rotate(160)"/>
      <use href="#cl" transform="rotate(58) scale(0.9)"/>
      <use href="#cl" transform="rotate(122) scale(0.9)"/>
      <use href="#cl" transform="rotate(90) scale(0.8)"/>
      <path d="M0 0 C0 -6 1 -11 4 -16" stroke="#3a8d3c" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <circle r="2.6" fill="#2f8035"/>
    </g>

    <!-- тело клубники: семена + объём -->
    <g id="sbBody">
      <g clip-path="url(#sbClip)">
        <rect x="-40" y="-40" width="80" height="90" fill="url(#seeds)"/>
      </g>
      <use href="#sb" fill="url(#sbShade)"/>
      <path d="M-25 -14 C-23 -24 -15 -29 -6 -30" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- мята -->
    <linearGradient id="mintG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f8f3a"/>
      <stop offset="1" stop-color="#8be06b"/>
    </linearGradient>
    <g id="mint">
      <path d="M0 0 C-6 -4 -14 -8 -15 -18 C-16 -26 -9 -34 0 -44 C9 -34 16 -26 15 -18 C14 -8 6 -4 0 0Z" fill="url(#mintG)" stroke="#2d7a32" stroke-width="0.8" stroke-opacity="0.6"/>
      <g stroke="#c4f7a8" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round" fill="none">
        <path d="M0 -2 L0 -38"/>
        <path d="M0 -10 L-9 -17"/><path d="M0 -10 L9 -17"/>
        <path d="M0 -20 L-10 -28"/><path d="M0 -20 L10 -28"/>
      </g>
    </g>

    <!-- голубика -->
    <radialGradient id="bbG" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8ea3d6"/>
      <stop offset="0.45" stop-color="#4a5e9c"/>
      <stop offset="1" stop-color="#1a2450"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.35" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="crown">
      <circle r="6.8" fill="#18214a" opacity="0.65"/>
      <path d="M0 -6 L1.53 -2.1 L5.71 -1.85 L2.47 0.8 L3.53 4.85 L0 2.6 L-3.53 4.85 L-2.47 0.8 L-5.71 -1.85 L-1.53 -2.1Z" fill="#2a376b" stroke="#8296c8" stroke-width="0.8" stroke-linejoin="round"/>
    </g>
    <g id="bb">
      <circle r="20" fill="url(#bbG)"/>
      <circle r="20" fill="url(#bloom)"/>
      <g transform="translate(-1 -4) scale(1.25)"><use href="#crown"/></g>
      <path d="M-15 -9 A17 17 0 0 1 -5 -16" stroke="#b8c7ee" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#10223d" flood-opacity="0.35"/>
    </filter>
    <filter id="gb" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- тень на поверхности -->
  <ellipse cx="102" cy="187" rx="84" ry="8" fill="#1b2a4a" opacity="0.25" filter="url(#gb)"/>

  <!-- мята -->
  <use href="#mint" transform="translate(50 82) rotate(-52) scale(1.1)"/>
  <use href="#mint" transform="translate(46 104) rotate(-82) scale(0.85)"/>
  <use href="#mint" transform="translate(100 74) rotate(-8) scale(1.2)"/>
  <use href="#mint" transform="translate(116 68) rotate(38) scale(1)"/>

  <!-- клубника сзади справа -->
  <g transform="translate(140 94) rotate(20) scale(0.95)" filter="url(#sh)">
    <use href="#sb" fill="url(#sbFront)"/>
    <use href="#sbBody"/>
    <use href="#sb" fill="#4a0008" opacity="0.28"/>
    <use href="#calyx" transform="translate(0 -31)"/>
  </g>

  <!-- клубника сзади слева -->
  <g transform="translate(62 94) rotate(-24) scale(0.82)" filter="url(#sh)">
    <use href="#sb" fill="url(#sbFront)"/>
    <use href="#sbBody"/>
    <use href="#sb" fill="#4a0008" opacity="0.15"/>
    <use href="#calyx" transform="translate(0 -31)"/>
  </g>

  <!-- клубника спереди -->
  <g transform="translate(100 118) rotate(-4) scale(1.15)" filter="url(#sh)">
    <use href="#sb" fill="url(#sbFront)"/>
    <use href="#sbBody"/>
    <use href="#calyx" transform="translate(0 -31)"/>
  </g>

  <!-- голубика слева -->
  <g transform="translate(46 150) scale(0.9)" filter="url(#sh)"><use href="#bb"/></g>
  <g transform="translate(68 175) scale(0.85)" filter="url(#sh)"><use href="#bb"/></g>

  <!-- голубика справа -->
  <g transform="translate(164 148) scale(0.92)" filter="url(#sh)"><use href="#bb"/></g>
  <g transform="translate(142 166) scale(1)" filter="url(#sh)"><use href="#bb"/></g>
  <g transform="translate(118 178) scale(0.8)" filter="url(#sh)"><use href="#bb"/></g>
  <g transform="translate(173 175) scale(0.8)" filter="url(#sh)"><use href="#bb"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
